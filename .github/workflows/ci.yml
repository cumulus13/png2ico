name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-13 (Intel) has been retired.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # Verifies `rust-version` in Cargo.toml is honest. A lockfile is generated
  # with the MSRV-aware resolver so dependencies that need a newer compiler
  # (e.g. edition 2024 crates) are not selected.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install 1.85 --profile minimal
      - name: Generate MSRV-compatible lockfile
        run: |
          rm -f Cargo.lock
          cargo +stable generate-lockfile
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.85 check --all-targets --locked

  # Plain `cargo audit` (no write permissions needed), so it also works on
  # Dependabot PRs, whose GITHUB_TOKEN is read-only.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: |
          [ -f Cargo.lock ] || cargo generate-lockfile
          cargo audit
