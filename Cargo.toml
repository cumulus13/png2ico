[package]
name = "png2ico"
version = "1.0.3"
edition = "2021"
rust-version = "1.85"
authors = ["Hadi Cahyadi <cumulus13@gmail.com>"]
description = "Fast, robust PNG/JPEG/WebP/BMP/GIF/TIFF to ICO converter with multi-size, PNG/BMP encoding, batch and parallel processing"
documentation = "https://docs.rs/png2ico"
homepage = "https://github.com/cumulus13/png2ico"
repository = "https://github.com/cumulus13/png2ico"
readme = "README.md"
license = "MIT"
keywords = ["ico", "png", "icon", "converter", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = [".github/", "tests/fixtures/"]

[lib]
name = "png2ico"
path = "src/lib.rs"

[[bin]]
name = "png2ico"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap-version-flag = "1.0.7"
clap-color-help = "0.1.3"
clap_complete = "4.5"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
rayon = "1.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }
anyhow = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# cargo-binstall: install prebuilt binaries from GitHub Releases
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
